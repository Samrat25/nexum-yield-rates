name: CI — Nexum Protocol

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Smart Contract Build & Check ─────────────────────────────────────────────
  contracts:
    name: Rust · Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-

      - name: Check Rust contract workspace
        working-directory: contracts
        run: cargo check --target wasm32-unknown-unknown --workspace

      - name: Build contracts (WASM)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release --workspace

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore
          retention-days: 7

  # ── Frontend Build ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          VITE_VAULT_ID: "CDWUAGLEHR7DMWX5LLND24OOBJBALUIIBGA6CMI7XQ3OZ5CGEOXIZFES"
          VITE_PT30D_ID: "CA433DJVYAXD32VM3A3ALO4Z3VO35KSIBSAD5H3ONT5AXBKLJD3PBSF5"
          VITE_PT90D_ID: "CD2B37RWEBG5PBTV4II27CHAFYYDA2BMIY3U5WDDHGYDWDWXN5X35JOF"
          VITE_PT180D_ID: "CBA4OHMVJ62BD5S6TJVE4QRGNISH6HJT3WKNU4HFXW4YRS66Q34DX6LI"
          VITE_ROUTER_ID: "CBKYDXU6HEDR2J4X24W56V5YRPP4FCSB563D5XFF3D35RCSX53T244S7"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .output/
          if-no-files-found: ignore
          retention-days: 7
